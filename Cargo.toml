[package]
name = "skills-mcp"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[dependencies]
mcp-core = { git = "https://github.com/adelie-ai/mcp-core" }
clap = { version = "4.5.54", features = ["derive", "env"] }
dirs = "6"
schemars = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml_ng = "0.10"
shellexpand = "3.1"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["full"] }
# Structured logging for this crate's own diagnostics (the skipped-entry
# warning in src/repo.rs). Already in the dependency tree through
# mcp-core -> adelie-telemetry, so naming it directly here adds no crate.
tracing = "0.1.44"
walkdir = "2"

[dev-dependencies]
# The capturing layer the telemetry tests use to read back what a real call
# emitted, mirroring mcp-core's own test support. Already in the tree through
# mcp-core's dev-dependencies, so this adds no crate to the test build.
tracing-subscriber = "0.3.23"

[features]
# OTLP export of this server's traces, metrics and log records, via
# mcp-core's passthrough to adelie-telemetry. Off by default: with it off, no
# opentelemetry crate is resolved, so a plain `cargo install` is unaffected.
# Turn it on with `cargo build --features otel` and configure it with the
# standard OTEL_* environment variables -- see README.md's Logging section.
otel = ["mcp-core/otel"]

[lints.rust]
warnings = "deny"

[lints.clippy]
all = "deny"

# Release profiles. Default favors small, fast binaries (strip + thin LTO).
# Build variants: `cargo build --profile release-fast` / `--profile release-small`.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "unwind"

[profile.release-fast]
inherits = "release"
lto = "fat"

[profile.release-small]
inherits = "release"
opt-level = "z"
lto = "fat"
panic = "abort"
strip = true
